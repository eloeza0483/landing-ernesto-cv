server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Para que un healthcheck (Docker, Caddy, monitoreo) no dependa de que
    # exista index.html ni de que el build haya salido bien.
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Los assets de Vite llevan hash en el nombre (main.a1b2c3.js), así que
    # se pueden cachear "para siempre" sin riesgo de servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sitio sin router del lado del cliente, pero el fallback a index.html
    # no estorba y deja la puerta abierta si algún día se agrega uno.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
